<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">协调转弯 EKF 状态与过程噪声示意</title>
  <desc id="desc">圆弧上的目标位置与切线速度，以及状态向量、切向和法向加速度噪声与转弯率过程噪声。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2864a5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#d47b18"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#68778a"/>
    </marker>
  </defs>
  <rect width="1080" height="470" rx="18" fill="#f7f9fc"/>
  <text x="36" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#172b46">协调转弯（CT）模型：状态与噪声</text>

  <g font-family="sans-serif">
    <circle cx="275" cy="245" r="142" fill="none" stroke="#aab7c8" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M275 103 A142 142 0 0 1 417 245" fill="none" stroke="#2864a5" stroke-width="5"/>
    <circle cx="275" cy="245" r="5" fill="#68778a"/>
    <line x1="275" y1="245" x2="417" y2="245" stroke="#68778a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/>
    <text x="335" y="232" font-size="17" fill="#53657c">半径 r</text>

    <circle cx="417" cy="245" r="10" fill="#2864a5" stroke="#fff" stroke-width="3"/>
    <line x1="417" y1="245" x2="417" y2="323" stroke="#2864a5" stroke-width="5" marker-end="url(#arrow-blue)"/>
    <text x="430" y="277" font-size="18" font-weight="700" fill="#2864a5">速度 v</text>
    <text x="428" y="226" font-size="16" fill="#334860">当前状态</text>

    <path d="M451 232 A176 176 0 0 1 437 303" fill="none" stroke="#d47b18" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="460" y="263" font-size="17" font-weight="700" fill="#b6670d">ω：转弯率</text>

    <circle cx="275" cy="103" r="7" fill="#fff" stroke="#2864a5" stroke-width="3"/>
    <circle cx="375" cy="144" r="8" fill="#d47b18" stroke="#fff" stroke-width="2"/>
    <text x="190" y="88" font-size="16" fill="#53657c">圆心</text>
    <text x="91" y="399" font-size="16" fill="#53657c">速度方向持续旋转，位置沿弧线前进</text>
    <text x="96" y="425" font-size="14" fill="#68778a">示意轨迹（不按比例）</text>
  </g>

  <g font-family="sans-serif">
    <rect x="570" y="78" width="470" height="310" rx="14" fill="#fff" stroke="#d5deea"/>
    <text x="600" y="119" font-size="21" font-weight="700" fill="#172b46">状态向量</text>
    <text x="600" y="157" font-size="20" fill="#263d59">[ x, y, vx, vy, ω ]ᵀ</text>
    <text x="600" y="190" font-size="16" fill="#53657c">位置 + 速度 + 带符号的转弯角速度</text>
    <line x1="600" y1="214" x2="1010" y2="214" stroke="#e2e8f0" stroke-width="2"/>
    <text x="600" y="249" font-size="19" font-weight="700" fill="#172b46">过程噪声 Q</text>
    <rect x="600" y="268" width="11" height="11" rx="2" fill="#2864a5"/>
    <text x="624" y="280" font-size="16" fill="#334860">qₜ / qₙ：切向变速与法向转弯偏差</text>
    <rect x="600" y="305" width="11" height="11" rx="2" fill="#d47b18"/>
    <text x="624" y="317" font-size="16" fill="#334860">qω：转弯率随机游走，允许弯曲程度改变</text>
    <text x="600" y="356" font-size="15" fill="#68778a">EKF 每帧线性化状态方程，并传播预测协方差</text>
  </g>
</svg>
